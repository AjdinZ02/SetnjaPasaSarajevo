services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: setnja-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
  ecomm-fit-2026:
    image: mcr.microsoft.com/azure-sql-edge:1.0.7
    container_name: ecomm-fit-2026
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
  worker:
    build:
      context: .
      dockerfile: SetnjaPasaSarajevo.Worker/Dockerfile
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      ConnectionStrings__DefaultConnection: "Server=ecomm-fit-2026,1433;Database=SetnjaPasaSarajevo;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      - rabbitmq
      - ecomm-fit-2026
volumes:
  sqlserver_data:
